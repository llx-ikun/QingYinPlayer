# ruff 静态检查配置（v2.0 引入）
# 规则集按本代码base实际约定裁剪：中文注释/字符串中的全角标点属正常用法，
# UTF-8 声明与导入排序为项目既有约定，均不强制。
target-version = "py313"
line-length = 120

[lint]
select = ["F", "E", "W", "B", "SIM", "RUF"]
ignore = [
    "UP009",    # 保留文件头 UTF-8 声明（中文源码）
    "I001",     # 导入排序不做强制
    "RUF100",   # 既有 noqa 按当时需要添加
    "RUF001",   # 字符串内全角标点（中文文案）
    "RUF002",   # docstring 内全角标点（中文注释）
    "RUF003",   # 注释内全角标点（中文注释）
    "RUF012",   # 类级可变常量（_PHASE 等有状态单例，刻意为之）
]
